name: Glyph
options:
  bundleIdPrefix: com.edwardgao
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: ${GLYPH_BUILD}
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    COREML_CODEGEN_LANGUAGE: None
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  GlyphCore:
    path: GlyphCore

targets:
  Glyph:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      # Decoder resources ship once, here; the extension reads them from its containing app's bundle.
      - path: Resources/SwipeAREncoder.mlpackage
        buildPhase: sources
      - path: Resources/SwipeARStep.mlpackage
        buildPhase: sources
      - path: Resources/ar_meta.json
        buildPhase: resources
      - path: Resources/ilm.bin
        buildPhase: resources
      - path: Resources/lexicon.bin
        buildPhase: resources
      - path: Resources/SwipeLM.mlpackage
        buildPhase: sources
      - path: Resources/lm_meta.json
        buildPhase: resources
      - path: Resources/priors.bin
        buildPhase: resources
      - path: Resources/gpt2/vocab.json
        buildPhase: resources
      - path: Resources/gpt2/merges.txt
        buildPhase: resources
      - path: Resources/race_prompts.json
        buildPhase: resources
    dependencies:
      - target: GlyphKeyboard
        embed: true
      - package: GlyphCore
    scheme:
      testTargets: [GlyphUITests]
      environmentVariables:
        SWIPE_SHOTS: ${SWIPE_SHOTS}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edwardgao.glyph
        PRODUCT_NAME: Glyph
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Glyph
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"   # xcodegen's target default is "1,2"; iPhone only
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Glyph
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        # Upload token for the game's records, injected at generation time
        # (GLYPH_UPLOAD_TOKEN in the environment; empty = uploads disabled).
        GlyphUploadToken: ${GLYPH_UPLOAD_TOKEN}
        GlyphBuild: ${GLYPH_BUILD}
        CFBundleShortVersionString: "0.1"
        # HTTPS only, no proprietary cryptography: exempt from export compliance.
        ITSAppUsesNonExemptEncryption: false
        CFBundleVersion: ${GLYPH_BUILD}
        # HTTPS to the Worker needs no exception; local networking lets a
        # developer point the game at research/iphone/server.py on a LAN.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  GlyphUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
      - path: Resources/bench_gestures.json
        buildPhase: resources
    dependencies:
      - target: Glyph
    settings:
      base:
        TEST_TARGET_NAME: Glyph
        PRODUCT_BUNDLE_IDENTIFIER: com.edwardgao.glyph.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: UITests/GlyphUITests-Bridging-Header.h

  GlyphKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Extension
      - Shared
    dependencies:
      - package: GlyphCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edwardgao.glyph.keyboard
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: GlyphKeyboard
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: Glyph
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: false
