[project]
name = "swipe-typing"
version = "0.1.0"
description = "Normalized loaders and features for public swipe/gesture-typing corpora"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyarrow>=14",
    "scipy>=1.10",
    "huggingface-hub>=0.23",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Encoder training. Decoding and the data pipeline need neither.
train = ["torch>=2.2"]
# General English vocabulary for the decoder lexicon. Without it, the lexicon
# falls back to the training corpus vocabulary.
lexicon = ["wordfreq>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swipe_typing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
